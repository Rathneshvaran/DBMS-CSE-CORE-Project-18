{% extends 'base.html' %}{% block content %}<div class="page-title"><p class="eyebrow">BAGGAGE SERVICES</p><h1>Baggage entry</h1></div><form class="searchbar" method="get"><label>PNR<input name="pnr" value="{{pnr}}" required></label><button class="btn primary">Find ticket</button></form>{% if row %}<section class="panel compact"><h2>{{row.full_name}} · {{row.flight_number}} · Seat {{row.seat_number}}</h2><form method="post" class="inline-form"><input type="hidden" name="pnr" value="{{row.pnr}}"><label>Bags<input type="number" name="bag_count" min="0" value="1" required></label><label>Total weight (kg)<input type="number" name="weight" min="0" step="0.1" value="10" required></label><button class="btn primary">Record baggage</button></form><p class="hint">First 15 kg included in fare; excess is ₹300/kg for this demo.</p></section>{% endif %}{% endblock %}
