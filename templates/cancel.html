{% extends 'base.html' %}{% block content %}<div class="page-title"><p class="eyebrow">POST-BOOKING</p><h1>Cancellation & refund</h1></div><form class="searchbar" method="get"><label>PNR<input name="pnr" value="{{pnr}}" required></label><button class="btn primary">Find booking</button></form>{% if row %}<section class="panel compact"><h2>{{row.full_name}} · {{row.pnr}}</h2><p>Original payment: <strong>₹{{'%.2f'|format(row.amount or 0)}}</strong></p><p>Demo refund rule: <strong>80% of paid amount</strong>.</p>{% if row.status=='Confirmed' %}<form method="post"><input type="hidden" name="pnr" value="{{row.pnr}}"><label>Reason<input name="reason" value="Customer request" required></label><button class="btn danger">Cancel & process refund</button></form>{% endif %}</section>{% endif %}{% endblock %}
