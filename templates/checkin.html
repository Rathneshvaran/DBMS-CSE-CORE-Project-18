{% extends 'base.html' %}{% block content %}<div class="page-title"><p class="eyebrow">PASSENGER SERVICES</p><h1>Online check-in</h1></div><form class="searchbar" method="get"><label>PNR<input name="pnr" value="{{pnr}}" required></label><button class="btn primary">Find booking</button></form>{% if row %}<section class="panel compact"><h2>{{row.full_name}} · {{row.flight_number}}</h2><p>Seat <strong>{{row.seat_number}}</strong> · Departure {{row.departure_time}}</p><form method="post"><input type="hidden" name="pnr" value="{{row.pnr}}"><button class="btn primary" {% if row.status!='Confirmed' %}disabled{% endif %}>Complete Check-in</button></form></section>{% endif %}{% endblock %}
